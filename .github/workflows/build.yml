name: build

on:
  push:
    branches: [master, main, OtherObjects]
  pull_request:
    branches: [master, main, OtherObjects]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Debug
            audio_configuration: Debug
          - variant: Release
            audio_configuration: Release
          - variant: Exiled
            audio_configuration: Debug
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore packages.config -PackagesDirectory ..\packages -NonInteractive

      - name: Download SteamCMD
        shell: pwsh
        continue-on-error: true
        run: |
          $steamCmdRoot = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $steamCmdArchive = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          $serverPath = Join-Path $env:RUNNER_TEMP 'scp-sl-server'

          Add-Content -Path $env:GITHUB_ENV -Value "STEAMCMD_ROOT=$steamCmdRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "SCP_SL_SERVER_PATH=$serverPath"

          try {
            Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $steamCmdArchive -ErrorAction Stop
            Expand-Archive -LiteralPath $steamCmdArchive -DestinationPath $steamCmdRoot -Force -ErrorAction Stop
            Add-Content -Path $env:GITHUB_ENV -Value 'STEAMCMD_DOWNLOAD_FAILED=false'
          } catch {
            Add-Content -Path $env:GITHUB_ENV -Value 'STEAMCMD_DOWNLOAD_FAILED=true'
            Write-Warning "SteamCMD download failed: $($_.Exception.Message)"
          }

      - name: Bootstrap SteamCMD
        shell: pwsh
        continue-on-error: true
        run: |
          $steamCmd = Join-Path $env:STEAMCMD_ROOT 'steamcmd.exe'
          $bootstrapSucceeded = $false

          if ($env:STEAMCMD_DOWNLOAD_FAILED -ne 'true' -and (Test-Path -LiteralPath $steamCmd)) {
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & $steamCmd '+quit'
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0) {
                $bootstrapSucceeded = $true
                break
              }

              Write-Warning "SteamCMD bootstrap attempt $attempt returned $exitCode."
              if ($attempt -lt 5) {
                Start-Sleep -Seconds 2
              }
            }
          } else {
            Write-Warning 'SteamCMD is unavailable; using fallback references.'
          }

          if ($bootstrapSucceeded) {
            Add-Content -Path $env:GITHUB_ENV -Value 'STEAMCMD_BOOTSTRAP_FAILED=false'
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value 'STEAMCMD_BOOTSTRAP_FAILED=true'
            Write-Warning 'SteamCMD bootstrap did not complete after 5 attempts.'
          }

      - name: Install SCP:SL dedicated server
        shell: pwsh
        continue-on-error: true
        run: |
          $steamCmd = Join-Path $env:STEAMCMD_ROOT 'steamcmd.exe'
          $serverPath = $env:SCP_SL_SERVER_PATH
          $installSucceeded = $false

          if ($env:STEAMCMD_BOOTSTRAP_FAILED -eq 'false' -and (Test-Path -LiteralPath $steamCmd)) {
            & $steamCmd '+login' 'anonymous' '+app_info_update' '1' '+app_info_print' '996560' '+quit'
            $appInfoExitCode = $LASTEXITCODE
            if ($appInfoExitCode -ne 0) {
              Write-Warning "SCP:SL app-info refresh returned $appInfoExitCode; using fallback references."
            } else {
              & $steamCmd '+force_install_dir' $serverPath '+login' 'anonymous' '+app_update' '996560' 'validate' '+quit'
              if ($LASTEXITCODE -eq 0) {
                $installSucceeded = $true
              } else {
                Write-Warning "SCP:SL installation returned $LASTEXITCODE; using fallback references."
              }
            }
          } else {
            Write-Warning 'SteamCMD bootstrap failed; using fallback references.'
          }

          if ($installSucceeded) {
            Add-Content -Path $env:GITHUB_ENV -Value 'STEAMCMD_INSTALL_FAILED=false'
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value 'STEAMCMD_INSTALL_FAILED=true'
          }

      - name: Select game references
        shell: pwsh
        run: |
          $requiredFiles = @(
            'Assembly-CSharp-firstpass.dll'
            'CommandSystem.Core.dll'
            'Mirror.dll'
            'mscorlib.dll'
            'NorthwoodLib.dll'
            'Pooling.dll'
            'System.dll'
            'System.Core.dll'
            'Unity.TextMeshPro.dll'
            'UnityEngine.dll'
            'UnityEngine.AnimationModule.dll'
            'UnityEngine.AssetBundleModule.dll'
            'UnityEngine.CoreModule.dll'
            'UnityEngine.PhysicsModule.dll'
            'YamlDotNet.dll'
          )
          $serverReferencesPath = Join-Path $env:SCP_SL_SERVER_PATH 'SCPSL_Data\Managed'
          $fallbackReferencesPath = Join-Path $env:GITHUB_WORKSPACE '..\packages\Exiled.Dev.References.1.0.4\lib\net48'
          $selectedReferencesPath = $null

          if ($env:STEAMCMD_INSTALL_FAILED -eq 'false') {
            $missingFiles = @($requiredFiles | Where-Object {
                -not (Test-Path -LiteralPath (Join-Path $serverReferencesPath $_))
              })
            if ($missingFiles.Count -eq 0) {
              $selectedReferencesPath = $serverReferencesPath
              Write-Host "Using SteamCMD references from $selectedReferencesPath"
            } else {
              Write-Warning "SteamCMD references are incomplete: $($missingFiles -join ', ')"
            }
          }

          if ($null -eq $selectedReferencesPath) {
            $missingFiles = @($requiredFiles | Where-Object {
                -not (Test-Path -LiteralPath (Join-Path $fallbackReferencesPath $_))
              })
            if ($missingFiles.Count -gt 0) {
              throw "Fallback references are incomplete at ${fallbackReferencesPath}: $($missingFiles -join ', ')"
            }

            $selectedReferencesPath = $fallbackReferencesPath
            Write-Warning "Using Exiled.Dev.References fallback from $selectedReferencesPath"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "REFERENCES_PATH=$selectedReferencesPath"

      - name: Install assembly publicizer
        shell: pwsh
        run: dotnet tool install --tool-path "$env:RUNNER_TEMP\publicizer" BepInEx.AssemblyPublicizer.Cli --version 0.4.3 --no-cache

      - name: Publicize Mirror reference
        shell: pwsh
        run: |
          $mirrorPath = Join-Path $env:REFERENCES_PATH 'Mirror.dll'
          $publicizedPath = Join-Path $env:REFERENCES_PATH 'Mirror_publicized.dll'
          $publicizer = Join-Path $env:RUNNER_TEMP 'publicizer\assembly-publicizer.exe'

          if (-not (Test-Path -LiteralPath $mirrorPath)) {
            throw "Mirror.dll was not restored at $mirrorPath"
          }

          & $publicizer $mirrorPath -o $publicizedPath -f

      - name: Restore SDK package references
        shell: pwsh
        run: |
          $mirrorPath = Join-Path $env:REFERENCES_PATH 'Mirror_publicized.dll'
          & msbuild ProjectMER/ProjectMER.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 "/p:ReferencesPath=$env:REFERENCES_PATH" "/p:MirrorPath=$mirrorPath" /m
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Rebuild solution (${{ matrix.variant }})
        shell: pwsh
        run: |
          $mirrorPath = Join-Path $env:REFERENCES_PATH 'Mirror_publicized.dll'
          & msbuild ProjectMER.sln /t:Rebuild "/p:Configuration=${{ matrix.variant }}" /p:Platform=x64 "/p:ReferencesPath=$env:REFERENCES_PATH" "/p:MirrorPath=$mirrorPath" /m
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload ProjectMER artifact (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: ProjectMER-${{ matrix.variant }}
          path: ProjectMER/bin/x64/${{ matrix.variant }}/net4.8/ProjectMER.dll
          if-no-files-found: error

      - name: Upload AudioProjectMER artifact (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: AudioProjectMER-${{ matrix.variant }}
          path: AudioProjectMER/bin/${{ matrix.audio_configuration }}/AudioProjectMER.dll
          if-no-files-found: error
